<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV ChargeOps - Login</title>
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a1628;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ============================================================
           ANIMATED BACKGROUND — floating energy circles
           ============================================================ */
        .bg-animation {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            animation: float linear infinite;
        }

        .bg-circle:nth-child(1) {
            width: 420px;
            height: 420px;
            background: #22c55e;
            top: -120px;
            left: -80px;
            animation-duration: 22s;
        }

        .bg-circle:nth-child(2) {
            width: 300px;
            height: 300px;
            background: #3b82f6;
            bottom: -60px;
            right: -40px;
            animation-duration: 18s;
            animation-delay: -4s;
        }

        .bg-circle:nth-child(3) {
            width: 200px;
            height: 200px;
            background: #22c55e;
            top: 50%;
            right: 10%;
            animation-duration: 25s;
            animation-delay: -8s;
        }

        .bg-circle:nth-child(4) {
            width: 160px;
            height: 160px;
            background: #3b82f6;
            top: 20%;
            left: 15%;
            animation-duration: 20s;
            animation-delay: -12s;
        }

        .bg-circle:nth-child(5) {
            width: 260px;
            height: 260px;
            background: #22c55e;
            bottom: 15%;
            left: 5%;
            animation-duration: 28s;
            animation-delay: -6s;
        }

        .bg-circle:nth-child(6) {
            width: 180px;
            height: 180px;
            background: #3b82f6;
            top: 10%;
            right: 30%;
            animation-duration: 24s;
            animation-delay: -15s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(40px, -60px) scale(1.08);
            }
            50% {
                transform: translate(-30px, 30px) scale(0.95);
            }
            75% {
                transform: translate(50px, 50px) scale(1.05);
            }
            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        /* Gradient overlay sweep */
        .bg-animation::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(34, 197, 94, 0.03) 0%,
                transparent 40%,
                rgba(59, 130, 246, 0.03) 70%,
                transparent 100%
            );
            animation: gradient-shift 12s ease-in-out infinite alternate;
        }

        @keyframes gradient-shift {
            0% {
                opacity: 0.6;
            }
            100% {
                opacity: 1;
            }
        }

        /* ============================================================
           LOGIN CARD — glassmorphism
           ============================================================ */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 44px 36px 36px;
            margin: 16px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset;
        }

        /* ============================================================
           HEADER — icon + title + subtitle
           ============================================================ */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-icon {
            display: inline-block;
            margin-bottom: 12px;
        }

        .login-icon svg {
            width: 56px;
            height: 56px;
            filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.35));
        }

        .login-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #22c55e 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           ERROR MESSAGE
           ============================================================ */
        .error-message {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 20px;
        }

        /* ============================================================
           FORM ELEMENTS
           ============================================================ */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            outline: none;
        }

        .form-group input::placeholder {
            color: #475569;
        }

        .form-group input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        /* ============================================================
           SUBMIT BUTTON
           ============================================================ */
        .btn-login {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.25s ease, opacity 0.25s ease;
            margin-top: 4px;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
            opacity: 0.9;
        }

        /* ============================================================
           PROFILE HINTS
           ============================================================ */
        .profile-hints {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .profile-hints p {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 8px;
        }

        .profile-tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .profile-tag {
            display: inline-block;
            padding: 4px 14px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            font-size: 0.78rem;
            color: #93c5fd;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            position: relative;
            z-index: 1;
            margin-top: 28px;
            text-align: center;
            font-size: 0.78rem;
            color: #475569;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px 28px;
                border-radius: 16px;
            }

            .login-title {
                font-size: 1.7rem;
            }

            .login-icon svg {
                width: 48px;
                height: 48px;
            }

            .profile-tags {
                gap: 6px;
            }
        }

        @media (max-width: 360px) {
            .login-card {
                padding: 28px 18px 24px;
            }

            .login-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Animated background circles -->
    <div class="bg-animation">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <!-- Login card -->
    <div class="login-card">
        <div class="login-header">
            <!-- Charging plug / lightning bolt SVG icon -->
            <div class="login-icon">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Plug body -->
                    <rect x="20" y="34" width="24" height="18" rx="4" stroke="#22c55e" stroke-width="2.5" fill="rgba(34,197,94,0.1)"/>
                    <!-- Plug prongs -->
                    <line x1="28" y1="24" x2="28" y2="35" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="36" y1="24" x2="36" y2="35" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Cable -->
                    <path d="M32 52 L32 58" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Lightning bolt inside plug body -->
                    <path d="M35 38 L30 44 L33 44 L29 50" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <!-- Small energy arcs -->
                    <path d="M18 40 Q14 43 18 46" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
                    <path d="M46 40 Q50 43 46 46" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
                </svg>
            </div>
            <h1 class="login-title">EV ChargeOps</h1>
            <p class="login-subtitle">Gestao Inteligente de Recarga</p>
        </div>

        {% if erro %}
        <div class="error-message">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="/login" autocomplete="off">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuario" required autofocus>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="profile-hints">
            <p>Perfis disponiveis</p>
            <div class="profile-tags">
                <span class="profile-tag">morador</span>
                <span class="profile-tag">sindico</span>
                <span class="profile-tag">administrador</span>
            </div>
        </div>
    </div>

    <div class="footer">Challenge FIAP + GoodWe 2026</div>

</body>
</html>
